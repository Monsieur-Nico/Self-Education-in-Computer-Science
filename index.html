<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Self-Education in Computer Science</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="A completely free program to learn computer science course by course">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* Move the closed-state mobile sidebar toggle from the bottom-left to the
       top-left. Only target the closed state (body without .close) - when the
       sidebar is open the theme already places the toggle at the bottom so it
       doesn't sit on top of the search box at the top of the sidebar. */
    body:not(.close) .sidebar-toggle {
      top: 0;
      bottom: auto;
      padding: 10px 30px 30px 10px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Self-Education in CS',
      repo: 'Monsieur-Nico/Self-Education-in-Computer-Science',
      loadSidebar: true,
      coverpage: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search',
        noData: 'No results found'
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>

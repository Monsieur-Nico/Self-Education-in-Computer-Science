<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Self-Education in Computer Science</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="A low-cost program to learn computer science course by course">
  <meta name="impact-site-verification" value="96762337-4086-4f5e-b2ef-895f09b823b7">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="assets/wheel-nav.css">
  <style>
    /* ---- Dark "techy" theme -----------------------------------------
       Overrides the default light Vue theme with a dark, high-contrast
       palette more in line with a CS/dev-tooling site. Docsify's own
       theme uses var(--theme-color) throughout (buttons, links, active
       sidebar item, search highlight, progress bar), so setting that
       one variable does most of the accent-color work automatically;
       everything else below covers backgrounds, text, and surfaces
       that the base theme hardcodes to light colors. */
    :root {
      --theme-color: #22d3ee;
      --accent-2: #a855f7;
      --bg: #0b0f19;
      --bg-cover: #05070d;
      --surface: #10162280;
      --text: #e8ecf3;
      --text-body: #c3cbd6;
      --text-dim: #8b95a7;
      --border: rgba(148, 163, 184, 0.16);
    }

    * {
      font-family: 'Inter', 'Source Sans Pro', Helvetica Neue, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-body);
    }

    ::selection {
      background: rgba(34, 211, 238, 0.3);
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 6px;
    }

    /* Sidebar */
    .sidebar {
      background-color: var(--bg);
      color: var(--text-dim);
      border-right: 1px solid var(--border);
    }

    .sidebar > h1 {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--text);
    }

    .sidebar ul li a {
      color: var(--text-dim);
    }

    .sidebar ul li a:hover {
      color: var(--text);
    }

    .sidebar ul li.active > a {
      color: var(--theme-color);
      text-shadow: 0 0 12px rgba(34, 211, 238, 0.35);
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: transparent;
    }

    .sidebar:hover::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
    }

    .search input {
      background-color: var(--surface) !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      border-radius: 6px !important;
    }

    .search input::placeholder {
      color: var(--text-dim);
    }

    .search h2 {
      color: var(--text-dim);
    }

    .search .matching-post {
      border-bottom: 1px solid var(--border);
    }

    .search .matching-post p {
      color: var(--text-dim);
    }

    .sidebar-toggle {
      background-color: transparent !important;
    }

    .sidebar-toggle span {
      background-color: var(--theme-color);
      box-shadow: 0 0 6px rgba(34, 211, 238, 0.8);
    }

    /* Content */
    .content {
      background-color: var(--bg);
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section strong {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
    }

    .markdown-section h1 {
      background: linear-gradient(90deg, var(--theme-color), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    .markdown-section h2 {
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.4rem;
    }

    .markdown-section h6 {
      color: var(--text-dim);
    }

    .markdown-section p,
    .markdown-section li {
      color: var(--text-body);
    }

    .markdown-section a {
      color: var(--theme-color);
    }

    .markdown-section a:hover {
      text-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
    }

    .markdown-section hr {
      border-bottom: 1px solid var(--border);
    }

    .markdown-section table td,
    .markdown-section table th {
      border: 1px solid var(--border);
    }

    .markdown-section table tr {
      background-color: transparent;
      border-top: 1px solid var(--border);
    }

    .markdown-section table tr:nth-child(2n) {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .markdown-section code {
      background: rgba(148, 163, 184, 0.14);
      color: #7dd3fc;
      font-family: 'JetBrains Mono', monospace;
      padding: 0.15em 0.4em;
      border-radius: 4px;
      font-size: 0.85em;
    }

    .markdown-section pre {
      background: #0f1420;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .markdown-section pre code {
      background: transparent;
      padding: 0;
    }

    .github-corner svg {
      color: var(--bg);
    }

    .app-nav a {
      color: var(--text-dim);
    }

    /* Cover page: dark gradient + faint circuit grid + glow blobs, in
       place of Docsify's random light pastel gradient (locked with
       !important to override that inline style - see note below). */
    .cover.show {
      background-color: var(--bg-cover) !important;
      background-image:
        linear-gradient(rgba(34, 211, 238, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.07) 1px, transparent 1px),
        radial-gradient(circle at 18% 20%, rgba(34, 211, 238, 0.22), transparent 42%),
        radial-gradient(circle at 82% 28%, rgba(168, 85, 247, 0.2), transparent 45%),
        linear-gradient(180deg, #05070d 0%, #0b0f19 100%) !important;
      background-size: 44px 44px, 44px 44px, auto, auto, auto !important;
    }

    .cover, .cover-main {
      color: var(--text);
    }

    /* Docsify's default cover title weighs in at 300 (thin) - fine on a
       plain background, but it all but disappears against the grid +
       glow behind it here. Bolding it and reusing the same gradient
       clip as every in-page h1 gives it real presence instead. */
    .cover-main h1 {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700 !important;
      letter-spacing: -0.01em;
      background: linear-gradient(90deg, var(--theme-color), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    section.cover blockquote {
      color: var(--text-dim);
      font-size: 1.15rem;
    }

    section.cover .cover-main > p:last-child a {
      font-family: 'JetBrains Mono', monospace;
    }

    section.cover .cover-main > p:last-child a:last-child {
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.45);
    }

    .cover-icon {
      display: block;
      width: 88px;
      height: 88px;
      margin: 0 auto 0.5em;
      filter: drop-shadow(0 0 20px rgba(34, 211, 238, 0.55)) drop-shadow(0 0 40px rgba(168, 85, 247, 0.3));
    }

    /* Concrete facts up top, in the same pill language as the wheel nav
       (see assets/wheel-nav.css), so the very first screen backs up the
       tagline with specifics instead of only a mission statement. */
    .cover-stats {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 1.4em 0 0;
    }

    .cover-stats span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-dim);
      background: #161c2c;
      border: 1px solid rgba(148, 163, 184, 0.32);
      border-radius: 999px;
      padding: 0.4em 0.9em;
    }

    .cover-badges {
      margin: 1.5em 0 1.5em;
    }

    .cover-badges img {
      margin: 0 4px;
      vertical-align: middle;
    }

    /* A single orchestrated entrance (icon, title, tagline, stats,
       badges, then the buttons) reads as considered; each element still
       just fades and settles in place, nothing moves far or bounces. */
    @keyframes cover-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cover-main > * {
      animation: cover-in 700ms cubic-bezier(.22,.8,.32,1) both;
    }

    .cover-main > *:nth-child(1) { animation-delay: 0ms; }
    .cover-main > *:nth-child(2) { animation-delay: 90ms; }
    .cover-main > *:nth-child(3) { animation-delay: 160ms; }
    .cover-main > *:nth-child(4) { animation-delay: 230ms; }
    .cover-main > *:nth-child(5) { animation-delay: 300ms; }
    .cover-main > *:nth-child(6) { animation-delay: 360ms; }

    @media (prefers-reduced-motion: reduce) {
      .cover-main > * {
        animation: none;
      }
    }

  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Self-Education in CS',
      repo: 'Monsieur-Nico/Self-Education-in-Computer-Science',
      relativePath: true,
      loadSidebar: true,
      coverpage: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search',
        noData: 'No results found'
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="assets/wheel-nav.js"></script>
</body>
</html>

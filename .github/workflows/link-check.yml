name: Link Checker

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Scan every markdown file. Amazon is excluded because it blocks
          # automated/bot traffic (returns 500s even for live listings),
          # which would produce false "broken" reports - those links are
          # verified manually instead. A realistic user agent and a couple
          # of retries cut down on other transient false positives.
          args: >-
            --no-progress
            --verbose
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
            --max-retries 2
            --exclude 'amazon\.(com|ca)'
            './**/*.md'
          fail: false
          format: markdown
          output: ./lychee-report.md

      - name: Create issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Link Checker: broken links found"
          content-filepath: ./lychee-report.md
          labels: broken link
